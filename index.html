<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShield Ads</title>
    <!-- مكتبة تيليجرام الأساسية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 🌟 إضافة مكتبة Adsgram الرسمية 🌟 -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 50px 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h2>شاهد الإعلان للحصول على 15 عملة 🪙</h2>
    <p>بمجرد انتهاء الإعلان، ستحصل على رصيدك فوراً.</p>
    
    <button id="showAdBtn">تشغيل الفيديو 📺</button>

    <script>
        // 1. تهيئة تطبيق تيليجرام
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 2. 🌟 تهيئة Adsgram (استبدل الرقم برقم Block ID الخاص بك) 🌟
        // مثال: إذا كان الرقم 1234، اكتب blockId: "1234"
        const AdController = window.Adsgram.init({ blockId: "42567" });

        // 3. التفاعل مع الزر
        document.getElementById('showAdBtn').addEventListener('click', function() {
            const btn = this;
            btn.innerText = "جاري تحميل الإعلان...";
            btn.disabled = true;

            // 4. طلب تشغيل الإعلان من Adsgram
            AdController.show().then((result) => {
                // المستخدم شاهد الإعلان بالكامل بنجاح ✅
                tg.sendData("ad_watched_successfully");
                tg.close();

            }).catch((result) => {
                // حدث خطأ، أو المستخدم أغلق الإعلان قبل انتهائه ❌
                btn.innerText = "تشغيل الفيديو 📺";
                btn.disabled = false;
                
                // إظهار رسالة تنبيه للمستخدم داخل تيليجرام
                tg.showAlert("لم تكتمل مشاهدة الإعلان، لم يتم إضافة الرصيد.");
            });
        });
    </script>
</body>
</html>
